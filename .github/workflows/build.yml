name: Electron Build (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_windows:
    name: Compilar para Windows
    runs-on: windows-latest

    steps:
      # 1. Checkout
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Instalación de dependencias
      - name: Instalar dependencias
        run: npm install

      # 4. Compilación Completa (Llama al script que gestiona Supabase, Angular y Electron)
      - name: Ejecutar Build y Empaquetado de Electron (Windows)
        run: npm run build:electron:win
        env:
          # Estas variables se usan en el script set-supabase-env.js
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Usado por electron-builder para autenticación de releases si es necesario
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 5. Subir artefactos
      - name: Subir artefactos de la compilación
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          # electron-builder dejará el archivo final en esta carpeta
          path: dist/
