<div class="p-4 max-w-xl mx-auto">
  <h2 class="text-2xl font-bold mb-4">Crear Cliente</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div class="flex gap-2">
      <select class="select" formControlName="personType">
        <option value="" disabled>Tipo de persona</option>
        <option value="natural">Natural</option>
        <option value="juridica">Jurídica</option>
      </select>
      <select class="select" formControlName="customerType">
        <option value="" disabled>Tipo de cliente</option>
        <option value="nuevo">Nuevo</option>
        <option value="frecuente">Frecuente</option>
        <option value="imprentero_nuevo">Imprentero Nuevo</option>
        <option value="imprentero_frecuente">Imprentero Frecuente</option>
      </select>
    </div>
    <input
      class="input input-bordered w-full"
      formControlName="firstName"
      placeholder="Nombres"
      required
    />
    <input
      class="input input-bordered w-full"
      formControlName="lastName"
      placeholder="Apellidos"
      required
    />
    <input
      class="input input-bordered w-full"
      formControlName="legalName"
      placeholder="Razón social"
    />
    <input
      class="input input-bordered w-full"
      formControlName="phone"
      placeholder="Teléfono"
      required
    />
    <input class="input input-bordered w-full" formControlName="dni" placeholder="DNI" />
    <input class="input input-bordered w-full" formControlName="ruc" placeholder="RUC" />
    <input
      class="input input-bordered w-full"
      formControlName="ce"
      placeholder="Carnet extranjería"
    />
    <input
      class="input input-bordered w-full"
      formControlName="email"
      placeholder="Email"
      type="email"
    />
    <!-- Campo notes como claves/valor dinámicas con FormArray -->
    <div class="card bg-base-100 p-4 mb-2">
      <label class="label mb-2">Notas (claves/valor)</label>
      <div formArrayName="notes">
        <div
          *ngFor="let group of notesArray.controls; let i = index"
          [formGroupName]="i"
          class="flex gap-2 mb-2 items-center"
        >
          <input class="input input-bordered w-1/2" formControlName="key" placeholder="Clave" />
          <input class="input input-bordered w-1/2" formControlName="value" placeholder="Valor" />
          <button type="button" class="btn btn-error btn-xs" (click)="removeNote(i)">✕</button>
        </div>
      </div>
      <button type="button" class="btn btn-success btn-sm mt-2" (click)="addNote()">
        Agregar nota
      </button>
      <p class="label text-xs mt-1">
        Agrega pares clave/valor para información adicional. Se enviarán como JSON.
      </p>
    </div>
    <button class="btn btn-primary w-full" type="submit" [disabled]="loading()">Guardar</button>
    @if (error()) {
      <div class="alert alert-error mt-2">{{ error() }}</div>
    }
    @if (success()) {
      <div class="alert alert-success mt-2">Cliente creado correctamente</div>
    }
  </form>
</div>
